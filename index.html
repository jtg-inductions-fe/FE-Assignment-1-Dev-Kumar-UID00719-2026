<!doctype html>
<html lang="en">
    <head>
        <title>JTG Travels | Assignment 1</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />

        <link rel="stylesheet" href="assets/icomoon/style.css" />
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar__gradient-layer" id="yellow-circle"></div>
            <div class="navbar__container">
                <button
                    type="button"
                    class="navbar__hamburger"
                    id="navbar-hamburger"
                    aria-label="Navigation menu"
                    tabindex="1"
                >
                    <span class="icon-Vector-2"></span>
                </button>

                <div class="navbar__logo">
                    <img src="assets/logos/mainlogo.png" alt="Travlog logo" />
                </div>

                <ul class="navbar__link-container">
                    <li>
                        <a class="navbar__links navbar__links--active" href="#">
                            Home
                        </a>
                    </li>
                    <li><a class="navbar__links" href="#">Discover</a></li>
                    <li><a class="navbar__links" href="#">Special Deals</a></li>
                    <li><a class="navbar__links" href="#">Contact</a></li>
                </ul>

                <div class="navbar__auth">
                    <button type="button" class="button button--secondary">
                        Log In
                    </button>
                    <button type="button" class="button button--primary">
                        Sign Up
                    </button>
                </div>
            </div>

            <div class="navbar__popup" id="navbar-popup">
                <ul class="navbar__popup-link-container">
                    <li>
                        <a class="navbar__links navbar__links--active" href="#">
                            Home
                        </a>
                    </li>
                    <li><a class="navbar__links" href="#">Discover</a></li>
                    <li><a class="navbar__links" href="#">Special Deals</a></li>
                    <li><a class="navbar__links" href="#">Contact</a></li>
                </ul>

                <div class="navbar__popup-auth">
                    <button type="button" class="button button--secondary">
                        Log In
                    </button>
                    <button type="button" class="button button--primary">
                        Sign Up
                    </button>
                </div>
            </div>
        </nav>

        <main class="main">
            <section class="hero">
                <div class="hero__overlay-clipart">
                    <img
                        src="assets/backgrounds/OBJECTS.svg"
                        alt="overlay clipart"
                    />
                </div>

                <div class="hero__top">
                    <div class="hero__image">
                        <div class="hero__bottom-layer">
                            <img
                                class="hero__bottom-layer-image"
                                src="assets/backgrounds/layer.png"
                                alt="Earth design"
                            />
                        </div>

                        <div class="hero__middle-layer">
                            <div class="hero__middle-layer-left">
                                <div
                                    class="hero__middle-layer-image1 hero__collage-image"
                                >
                                    <img
                                        class="hero__collage-img"
                                        src="assets/backgrounds/Rectangle1.jpg"
                                        alt="Coastal street"
                                    />
                                </div>
                                <div
                                    class="hero__middle-layer-image2 hero__collage-image"
                                >
                                    <img
                                        class="hero__collage-img"
                                        src="assets/backgrounds/Rectangle2.jpg"
                                        alt="Traveller on mountain"
                                    />
                                </div>
                            </div>

                            <div
                                class="hero__middle-layer-right hero__collage-image"
                            >
                                <img
                                    class="hero__collage-img"
                                    src="assets/backgrounds/Rectangle3.jpg"
                                    alt="Traveller taking picture on city streets"
                                />
                            </div>
                        </div>

                        <div class="hero__upper-layer">
                            <div class="hero__send-icon">
                                <img
                                    class="hero__icon-img"
                                    src="assets/logos/Frame 16.svg"
                                    alt="send icon"
                                />
                            </div>

                            <div class="hero__connect-icon">
                                <img
                                    class="hero__icon-img"
                                    src="assets/logos/Frame 17.svg"
                                    alt="Connect icon"
                                />
                            </div>

                            <div class="hero__upper-layer-overlay">
                                <span class="icon-Vector"></span>
                                <span>Top Places</span>
                            </div>
                        </div>
                    </div>

                    <div class="hero__top-left">
                        <div class="hero__explore">
                            <p>Explore the World!</p>
                            <span class="icon-Vector-1"></span>
                        </div>

                        <h1 class="heading hero__top-heading">
                            Travel
                            <span class="hero__top-heading-pink">
                                top destination
                            </span>
                            of the world
                        </h1>

                        <p class="paragraph hero__top-para">
                            We always make our customer happy by providing as
                            many choices as possible
                        </p>

                        <div class="hero__top-button-container">
                            <button
                                type="button"
                                class="button button--primary hero__top-button button-shadowed"
                                id="hero-btn1"
                            >
                                Get Started
                            </button>
                            <button
                                type="button"
                                class="button button--secondary button-outlined hero__top-button"
                                id="hero-btn2"
                            >
                                <span class="icon-Vector-4"></span>Watch Demo
                            </button>
                        </div>
                    </div>
                </div>

                <div class="hero__bottom">
                    <div class="hero__logo">
                        <img
                            class="logo-img"
                            src="assets/logos/Group copy.svg"
                            alt="Tripadvisor logo"
                        />
                    </div>

                    <div class="hero__logo">
                        <img
                            class="logo-img"
                            src="assets/logos/Group 2 copy.svg"
                            alt="Expedia logo"
                        />
                    </div>

                    <div class="hero__logo">
                        <img
                            class="logo-img"
                            src="assets/logos/Group.svg"
                            alt="Booking.com logo"
                        />
                    </div>

                    <div class="hero__logo">
                        <img
                            class="logo-img"
                            src="assets/logos/Group 9235.svg"
                            alt="Airbnb logo"
                        />
                    </div>

                    <div class="hero__logo">
                        <img
                            class="logo-img"
                            src="assets/logos/Group 3.svg"
                            alt="Orbitz logo"
                        />
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
