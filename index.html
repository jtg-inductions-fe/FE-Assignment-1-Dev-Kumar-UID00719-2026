<!doctype html>
<html lang="en">
    <head>
        <title>JTG Travels | Assignment 1</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />

        <link rel="stylesheet" href="assets/icomoon/style.css" />
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar__gradient-layer" id="yellow-circle"></div>
            <div class="navbar__container">
                <button
                    type="button"
                    class="navbar__hamburger"
                    id="navbar-hamburger"
                    aria-label="Navigation menu"
                    tabindex="1"
                >
                    <span class="icon-Vector-2"></span>
                </button>

                <div class="navbar__logo">
                    <img src="assets/logos/mainlogo.png" alt="" />
                </div>

                <ul class="navbar__link-container">
                    <li>
                        <a class="navbar__links navbar__links--active" href="#">
                            Home
                        </a>
                    </li>
                    <li><a class="navbar__links" href="#">Discover</a></li>
                    <li><a class="navbar__links" href="#">Special Deals</a></li>
                    <li><a class="navbar__links" href="#">Contact</a></li>
                </ul>

                <div class="navbar__auth">
                    <button type="button" class="button button--secondary">
                        Log In
                    </button>
                    <button type="button" class="button button--primary">
                        Sign Up
                    </button>
                </div>
            </div>

            <div class="navbar__popup" id="navbar-popup">
                <ul class="navbar__popup-link-container">
                    <li>
                        <a class="navbar__links navbar__links--active" href="#">
                            Home
                        </a>
                    </li>
                    <li><a class="navbar__links" href="#">Discover</a></li>
                    <li><a class="navbar__links" href="#">Special Deals</a></li>
                    <li><a class="navbar__links" href="#">Contact</a></li>
                </ul>

                <div class="navbar__popup-auth">
                    <button type="button" class="button button--secondary">
                        Log In
                    </button>
                    <button type="button" class="button button--primary">
                        Sign Up
                    </button>
                </div>
            </div>
        </nav>

        <main class="main">
            <section class="hero">
                <div class="hero__top">
                    <div class="hero__image">
                        <div class="hero__layer1">
                            <img src="assets/backgrounds/layer.png" alt="" />
                        </div>

                        <div class="hero__layer2">
                            <div class="hero__layer2-left">
                                <div
                                    class="hero__layer2-image1 hero__collage-image"
                                >
                                    <img
                                        src="assets/backgrounds/Rectangle1.jpg"
                                        alt=""
                                    />
                                </div>
                                <div
                                    class="hero__layer2-image2 hero__collage-image"
                                >
                                    <img
                                        src="assets/backgrounds/Rectangle2.jpg"
                                        alt=""
                                    />
                                </div>
                            </div>

                            <div class="hero__layer2-right hero__collage-image">
                                <img
                                    src="assets/backgrounds/Rectangle3.jpg"
                                    alt=""
                                />
                            </div>
                        </div>

                        <div class="hero__layer3">
                            <div class="hero__icon1">
                                <img src="assets/logos/Frame 16.svg" alt="" />
                            </div>

                            <div class="hero__icon2">
                                <img src="assets/logos/Frame 17.svg" alt="" />
                            </div>

                            <button class="hero__layer3-btn">
                                <span class="icon-Vector"></span>
                                <span>Top Places</span>
                            </button>
                        </div>
                    </div>

                    <div class="hero__top-left">
                        <button class="hero__explore-btn">
                            <p>Explore the World!</p>
                            <span class="icon-Vector-1"></span>
                        </button>

                        <h1 class="hero__top-heading">
                            Travel <span>top destination</span> of the world
                        </h1>

                        <p class="hero__top-para">
                            We always make our customer happy by providing as
                            many choices as possible
                        </p>

                        <div class="hero__top-button-container">
                            <button class="hero__btn" id="hero__btn1">
                                Get Started
                            </button>
                            <button class="hero__btn" id="hero__btn2">
                                <span class="icon-Vector-4"></span>Watch Demo
                            </button>
                        </div>
                    </div>
                </div>

                <div class="hero__bottom">
                    <div class="hero__logo">
                        <img src="assets/logos/Group copy.svg" alt="" />
                    </div>

                    <div class="hero__logo">
                        <img src="assets/logos/Group 2 copy.svg" alt="" />
                    </div>

                    <div class="hero__logo">
                        <img src="assets/logos/Group.svg" alt="" />
                    </div>

                    <div class="hero__logo">
                        <img src="assets/logos/Group 9235.svg" alt="" />
                    </div>

                    <div class="hero__logo">
                        <img src="assets/logos/Group 3.svg" alt="" />
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
